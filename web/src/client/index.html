<!doctype html>

<html>
  <head>
    <title>Home</title>
    <style>
      html {
        height: 100%;
        margin: 0;
      }

      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f0f0f0;
        height: 100%;
      }

      h1 {
        text-align: center;
        margin-top: 50px;
      }

      p {
        text-align: center;
        margin-top: 20px;
      }

      .container {
        display: flex;
        padding: 2rem;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
      }

      canvas {
        border-radius: 0.5rem;
        margin: auto;
        margin-top: 2rem;
        width: 800px;
        height: 800px;
      }
      .radio-group {
        margin-top: 2rem;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="radio-group">
        <label for="pan">Pan</label>
        <input
          name="canvas-input-mode"
          id="pan"
          type="radio"
          value="pan"
          checked
        />
        <label for="select">Select</label>
        <input
          name="canvas-input-mode"
          id="select"
          type="radio"
          value="select"
        />
      </div>
      <canvas tabindex="0"></canvas>
    </div>
    <script type="module" src="main.js"></script>
  </body>
</html>
