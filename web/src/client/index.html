<!doctype html>

<html>

<head>
  <title>High Performance Spreadsheet Computing</title>
  <style>
    html {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f0f0f0;
      height: 100%;
    }

    h1 {
      text-align: center;
      margin-top: 50px;
    }

    p {
      text-align: center;
      margin-top: 20px;
    }

    .container {
      display: flex;
      padding: 2rem;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      height: 100%;
    }

    canvas {
      border-radius: 0.5rem;
      /* margin: auto; */
      width: 800px;
      height: 800px;
    }

    .radio-group {
      background: white;
      position: absolute;
      left: 2rem;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      margin-top: 2rem;
    }

    .radio-group>div {
      width: 100%;
    }
  </style>
</head>

<body>
  <div class="container">
    <fieldset class="radio-group">
      <div>
        <input onclick="updateMode(this);" name="canvas-input-mode" id="select" type="radio" value="select" checked />
        <label for="select">Select</label>
      </div>
      <div>
        <input onclick="updateMode(this);" name="canvas-input-mode" id="pan" type="radio" value="pan" />
        <label for="pan">Pan</label>
      </div>
      <div><span id="fps">0</span> fps</div>
    </fieldset>
    <canvas tabindex="0"></canvas>
  </div>
  <script type="module" src="main.js"></script>
</body>

</html>
