<!doctype html>
<html lang="en-us">
    <head>
        <link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />
        <link rel="icon" type="image/png" href="/assets/logo.png" />
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no"
        />
        <title>tablemd</title>
        <style>
            :root {
                color-scheme: dark;
                --page-background: #181818;
                --panel-background: rgba(28, 28, 28, 0.9);
                --border-color: rgba(120, 120, 120, 0.6);
                --button-border-color: rgba(120, 120, 120, 0.5);
                --text-primary: #ffffff;
                --text-muted: rgba(255, 255, 255, 0.65);
                --surface-background: rgba(45, 45, 45, 0.85);
                --surface-background-soft: rgba(45, 45, 45, 0.5);
                --surface-hover: rgba(65, 65, 65, 0.9);
                --button-background: rgba(50, 50, 50, 0.9);
                --button-active: rgba(40, 40, 40, 0.9);
            }

            body {
                margin: 0;
                background-color: var(--page-background);
            }

            .game {
                position: absolute;
                top: 0px;
                left: 0px;
                margin: 0px;
                border: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                display: block;
                image-rendering: optimizeSpeed;
                image-rendering: -moz-crisp-edges;
                image-rendering: -o-crisp-edges;
                image-rendering: -webkit-optimize-contrast;
                image-rendering: optimize-contrast;
                image-rendering: crisp-edges;
                image-rendering: pixelated;
                -ms-interpolation-mode: nearest-neighbor;
            }

            table,
            th,
            td {
                border: 1px solid var(--text-primary);
                border-collapse: collapse;
            }

            th,
            td {
                padding: 5px;
            }

            .preview-view {
                position: fixed;
                inset: 0;
                background-color: var(--page-background);
                z-index: 1000;
                padding: 20px 20px 90px 20px;
                box-sizing: border-box;
                color: var(--text-primary);
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                    sans-serif;
                display: flex;
                flex-direction: column;
                align-items: center;
                transition: opacity 0.2s ease-in-out;
            }

            .preview-panel {
                width: min(800px, 100%);
                height: 100%;
                background-color: var(--panel-background);
                border: var(--border-color) solid 1px;
                border-radius: 18px;
                backdrop-filter: blur(10px);
                padding: 12px;
                box-sizing: border-box;
                display: flex;
                flex-direction: column;
                gap: 10px;
            }

            .preview-toolbar {
                display: flex;
                align-items: center;
                justify-content: flex-start;
            }

            .preview-select {
                background-color: var(--button-background);
                color: var(--text-primary);
                border: 1px solid var(--button-border-color);
                border-radius: 8px;
                padding: 6px 12px;
                font-family: inherit;
                font-size: 13px;
                font-weight: 500;
                cursor: pointer;
                outline: none;
                transition: background-color 0.2s, border-color 0.2s;
            }

            .preview-select:hover {
                background-color: var(--surface-hover);
            }

            .bottom-tabs {
                position: fixed;
                bottom: 20px;
                left: 50%;
                transform: translateX(-50%);
                background-color: var(--panel-background);
                border: var(--border-color) solid 1px;
                border-radius: 999px;
                backdrop-filter: blur(10px);
                padding: 4px;
                display: flex;
                align-items: center;
                gap: 4px;
                z-index: 1001;
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                    sans-serif;
            }

            .tab-button {
                background: transparent;
                border: 1px solid transparent;
                border-radius: 999px;
                color: var(--text-muted);
                padding: 8px 18px;
                font-family: inherit;
                font-size: 13px;
                font-weight: 500;
                cursor: pointer;
                transition:
                    background-color 0.2s,
                    color 0.2s,
                    border-color 0.2s;
            }

            .tab-button:hover {
                color: var(--text-primary);
                background-color: var(--surface-background-soft);
            }

            .tab-button.active {
                background-color: var(--button-background);
                border-color: var(--button-border-color);
                color: var(--text-primary);
            }

            .floating-button {
                position: fixed;
                bottom: 20px;
                width: 50px;
                height: 50px;
                background-color: var(--panel-background);
                border: var(--text-muted) solid 1px;
                border-radius: 50%;
                backdrop-filter: blur(10px);
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                color: var(--text-muted);
                transition: background-color 0.2s;
                z-index: 1001;
            }

            .floating-button:hover {
                background-color: var(--button-active);
            }

            .code-section {
                flex: 1;
                min-height: 0;
                background-color: var(--surface-background);
                border-radius: 8px;
                position: relative;
            }

            .overflow-container {
                overflow: auto;
                width: 100%;
                height: 100%;
                box-sizing: border-box;
            }

            .hidden {
                display: none !important;
            }

            #markdown-source {
                padding: 12px 10px;
                font-family: "Monaco", "Menlo", "Ubuntu Mono", monospace;
                font-size: 12px;
                line-height: 1.4;
                white-space: pre;
            }

            .copy-button {
                position: absolute;
                bottom: 10px;
                right: 10px;
                background-color: var(--button-background);
                border: 1px solid var(--button-border-color);
                border-radius: 4px;
                color: var(--text-primary);
                padding: 6px 8px;
                cursor: pointer;
                font-size: 11px;
                display: flex;
                align-items: center;
                gap: 4px;
                transition: background-color 0.2s;
            }

            .copy-button:hover {
                background-color: var(--surface-hover);
            }

            .copy-button:active {
                background-color: var(--button-active);
            }

            #html-render {
                padding: 12px 10px;
                overflow: auto;
            }

            input.invisible {
                position: absolute;
                left: -9999px;
                opacity: 0;
                pointer-events: none;
            }

            .github-button {
                right: 20px;
                text-decoration: none;
            }

            .collapsed {
                opacity: 0;
                pointer-events: none;
            }

            @media (prefers-color-scheme: light) {
                :root {
                    color-scheme: light;
                    --page-background: #f5f5f5;
                    --panel-background: rgba(255, 255, 255, 0.9);
                    --border-color: rgba(0, 0, 0, 0.16);
                    --button-border-color: rgba(0, 0, 0, 0.18);
                    --text-primary: #1a1a1a;
                    --text-muted: rgba(26, 26, 26, 0.6);
                    --surface-background: rgba(238, 238, 238, 0.9);
                    --surface-background-soft: rgba(245, 245, 245, 0.9);
                    --surface-hover: rgba(220, 220, 220, 0.96);
                    --button-background: rgba(230, 230, 230, 0.96);
                    --button-active: rgba(215, 215, 215, 0.98);
                }
            }

            @media (max-width: 768px) {
                .preview-view {
                    padding: 12px 12px 85px 12px;
                }
            }
        </style>
    </head>

    <body>
        <canvas
            class="game"
            id="canvas"
            oncontextmenu="event.preventDefault()"
        ></canvas>
        <input id="mobile-keyboard-focus" class="invisible" />
        <div class="preview-view collapsed" id="preview-view">
            <div class="preview-panel">
                <div class="preview-toolbar">
                    <select
                        id="preview-mode-select"
                        class="preview-select"
                        onchange="setPreviewMode(this.value)"
                    >
                        <option value="markdown">Markdown</option>
                        <option value="html">HTML</option>
                    </select>
                </div>
                <div class="code-section">
                    <div class="overflow-container" id="markdown-container">
                        <div id="markdown-source"></div>
                    </div>
                    <div class="overflow-container hidden" id="html-container">
                        <div id="html-render"></div>
                    </div>
                    <button
                        class="copy-button"
                        id="copy-preview-button"
                        onclick="copyPreview()"
                    >
                        <svg
                            width="12"
                            height="12"
                            viewBox="0 0 24 24"
                            fill="currentColor"
                        >
                            <path
                                d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"
                            />
                        </svg>
                        <span id="copy-button-text">Copy</span>
                    </button>
                </div>
            </div>
        </div>
        <div class="bottom-tabs" role="tablist">
            <button
                class="tab-button active"
                id="tab-canvas"
                role="tab"
                aria-selected="true"
                onclick="switchTab('canvas')"
            >
                Canvas
            </button>
            <button
                class="tab-button"
                id="tab-preview"
                role="tab"
                aria-selected="false"
                onclick="switchTab('preview')"
            >
                Preview
            </button>
        </div>
        <a href="https://github.com/albert-yu/tablemd" target="_blank" class="floating-button github-button">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path
                    d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.30.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"
                />
            </svg>
        </a>
        <script type="text/javascript">
            const preferredColorScheme = window.matchMedia(
                "(prefers-color-scheme: dark)",
            );

            function syncCanvasColorScheme() {
                if (
                    typeof Module !== "undefined" &&
                    Module._set_dark_mode
                ) {
                    Module._set_dark_mode(preferredColorScheme.matches ? 1 : 0);
                }
            }

            if (preferredColorScheme.addEventListener) {
                preferredColorScheme.addEventListener(
                    "change",
                    syncCanvasColorScheme,
                );
            } else {
                preferredColorScheme.addListener(syncCanvasColorScheme);
            }

            var Module = {
                preRun: [],
                print: (function () {
                    return function (text) {
                        text = Array.prototype.slice.call(arguments).join(" ");
                        console.log(text);
                    };
                })(),
                printErr: function (text) {
                    text = Array.prototype.slice.call(arguments).join(" ");
                    console.error(text);
                },
                onRuntimeInitialized: function () {
                    console.log("Initialized");
                    syncCanvasColorScheme();

                    // Check IndexedDB for saved tables
                    const request = indexedDB.open("tablemd", 1);

                    request.onupgradeneeded = function (event) {
                        const db = event.target.result;
                        if (!db.objectStoreNames.contains("tables")) {
                            db.createObjectStore("tables");
                        }
                    };

                    request.onsuccess = function (event) {
                        const db = event.target.result;
                        const transaction = db.transaction(
                            ["tables"],
                            "readonly",
                        );
                        const store = transaction.objectStore("tables");

                        store.get("current_tables").onsuccess = function (
                            event,
                        ) {
                            const savedData = event.target.result;
                            if (
                                savedData &&
                                savedData instanceof Uint8Array &&
                                savedData.length > 0
                            ) {
                                console.log("Found saved tables, loading...");

                                let dataPtr = null;
                                let retryCount = 0;
                                const maxRetries = 3;

                                function attemptDeserialize() {
                                    try {
                                        // Allocate memory in WebAssembly heap
                                        dataPtr = Module._malloc(
                                            savedData.length,
                                        );
                                        Module.HEAPU8.set(savedData, dataPtr);

                                        // Call the deserialize function
                                        Module._handle_deserialize(
                                            dataPtr,
                                            savedData.length,
                                        );

                                        // Clean up allocated memory
                                        Module._free(dataPtr);
                                        dataPtr = null;

                                        console.log(
                                            "Saved tables loaded successfully",
                                        );
                                    } catch (error) {
                                        console.error(
                                            "Failed to deserialize tables (attempt " +
                                                (retryCount + 1) +
                                                "):",
                                            error,
                                        );

                                        // Clean up allocated memory if it exists
                                        if (dataPtr !== null) {
                                            Module._free(dataPtr);
                                            dataPtr = null;
                                        }

                                        retryCount++;
                                        if (retryCount < maxRetries) {
                                            console.log(
                                                "Retrying deserialization in 100ms...",
                                            );
                                            setTimeout(attemptDeserialize, 100);
                                        } else {
                                            console.error(
                                                "Failed to deserialize tables after " +
                                                    maxRetries +
                                                    " attempts",
                                            );
                                        }
                                    }
                                }

                                attemptDeserialize();
                            } else {
                                console.log(
                                    "No saved tables found. Seeding example table...",
                                );

                                let retryCount = 0;
                                const maxRetries = 3;

                                function attemptSeedExample() {
                                    try {
                                        if (Module._seed_example_table) {
                                            Module._seed_example_table();
                                            console.log("Seeded example table");
                                        } else {
                                            throw new Error(
                                                "_seed_example_table function not available",
                                            );
                                        }
                                    } catch (error) {
                                        console.error(
                                            "Failed to seed example table (attempt " +
                                                (retryCount + 1) +
                                                "):",
                                            error,
                                        );

                                        retryCount++;
                                        if (retryCount < maxRetries) {
                                            console.log(
                                                "Retrying example table seeding in 100ms...",
                                            );
                                            setTimeout(attemptSeedExample, 100);
                                        } else {
                                            console.error(
                                                "Failed to seed example table after " +
                                                    maxRetries +
                                                    " attempts",
                                            );
                                        }
                                    }
                                }

                                attemptSeedExample();
                            }
                        };

                        transaction.onerror = function () {
                            console.error(
                                "Failed to read tables from IndexedDB",
                            );
                        };
                    };

                    request.onerror = function () {
                        console.error("Failed to open IndexedDB for reading");
                    };
                },
            };
            window.onerror = function () {
                console.log("onerror: " + event.message);
            };

            let activeTab = "canvas";
            let previewMode = "markdown";
            let copyResetTimeout = null;

            const COPY_ICON_SVG =
                '<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>';
            const CHECK_ICON_SVG =
                '<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/></svg>';

            function getCopyButtonLabel() {
                return previewMode === "html" ? "Copy HTML" : "Copy";
            }

            function renderCopyButtonDefault() {
                const button = document.getElementById("copy-preview-button");
                if (!button) return;
                button.innerHTML =
                    COPY_ICON_SVG +
                    '<span id="copy-button-text">' +
                    getCopyButtonLabel() +
                    "</span>";
            }

            function switchTab(tab) {
                activeTab = tab;
                const previewView = document.getElementById("preview-view");
                const tabCanvas = document.getElementById("tab-canvas");
                const tabPreview = document.getElementById("tab-preview");

                const isPreview = tab === "preview";
                previewView.classList.toggle("collapsed", !isPreview);
                tabCanvas.classList.toggle("active", !isPreview);
                tabCanvas.setAttribute("aria-selected", String(!isPreview));
                tabPreview.classList.toggle("active", isPreview);
                tabPreview.setAttribute("aria-selected", String(isPreview));
            }

            function setPreviewMode(mode) {
                previewMode = mode === "html" ? "html" : "markdown";
                const markdownContainer =
                    document.getElementById("markdown-container");
                const htmlContainer = document.getElementById("html-container");
                const isHtml = previewMode === "html";

                markdownContainer.classList.toggle("hidden", isHtml);
                htmlContainer.classList.toggle("hidden", !isHtml);

                if (copyResetTimeout) {
                    clearTimeout(copyResetTimeout);
                    copyResetTimeout = null;
                }
                renderCopyButtonDefault();
            }

            function copyPreview() {
                const text =
                    previewMode === "html"
                        ? document.getElementById("html-render").innerHTML
                        : document.getElementById("markdown-source").innerText;

                navigator.clipboard
                    .writeText(text)
                    .then(function () {
                        const button = document.getElementById(
                            "copy-preview-button",
                        );
                        if (!button) {
                            return;
                        }
                        if (copyResetTimeout) {
                            clearTimeout(copyResetTimeout);
                        }
                        button.innerHTML = CHECK_ICON_SVG + "Copied!";
                        copyResetTimeout = setTimeout(() => {
                            copyResetTimeout = null;
                            renderCopyButtonDefault();
                        }, 2000);
                    })
                    .catch(function (err) {
                        console.error("Failed to copy preview: ", err);
                    });
            }

            // Debounced auto-save functionality
            let saveTimeout;
            const SAVE_DELAY = 1000; // 1 second delay

            function debouncedAutoSave() {
                clearTimeout(saveTimeout);
                saveTimeout = setTimeout(() => {
                    if (Module._request_serialize) {
                        Module._request_serialize();
                        console.log("Auto-saved tables");
                    }
                }, SAVE_DELAY);
            }

            function handleWebPaste(text) {
                if (Module._handle_paste_from_web) {
                    const encoder = new TextEncoder();
                    const len = encoder.encode(text).length;
                    const bufLen = len + 1; // +1 for null terminator
                    const textPtr = Module._malloc(bufLen);
                    Module.stringToUTF8(text, textPtr, bufLen);
                    Module._handle_paste_from_web(textPtr);
                    Module._free(textPtr);
                }
            }

            // Prevent keyboard events from reaching the canvas when on the Preview tab
            function stopCanvasKeyEventsInPreview(event) {
                if (activeTab !== "canvas") {
                    event.stopImmediatePropagation();
                }
            }
            window.addEventListener("keydown", stopCanvasKeyEventsInPreview, true);
            window.addEventListener("keypress", stopCanvasKeyEventsInPreview, true);
            window.addEventListener("keyup", stopCanvasKeyEventsInPreview, true);

            // Add keyboard event listener for paste
            document.addEventListener("keydown", function (event) {
                if (activeTab !== "canvas") return;
                if ((event.ctrlKey || event.metaKey) && event.key === "v") {
                    event.preventDefault();
                    navigator.clipboard
                        .readText()
                        .then(function (text) {
                            handleWebPaste(text);
                        })
                        .catch(function (err) {
                            console.error("Failed to read clipboard: ", err);
                        });
                }
            });

            // Add keyboard event listeners for auto-save on typing
            document.addEventListener("keydown", function (event) {
                if (activeTab !== "canvas") return;
                // Skip modifier-only keys and function keys
                if (
                    event.ctrlKey ||
                    event.metaKey ||
                    event.altKey ||
                    event.key.startsWith("F") ||
                    [
                        "Shift",
                        "Control",
                        "Alt",
                        "Meta",
                        "CapsLock",
                        "Tab",
                        "Escape",
                    ].includes(event.key)
                ) {
                    return;
                }

                // Trigger debounced auto-save for text input keys
                if (
                    event.key.length === 1 ||
                    ["Backspace", "Delete", "Enter"].includes(event.key)
                ) {
                    debouncedAutoSave();
                }
            });
        </script>

    </body>
</html>
