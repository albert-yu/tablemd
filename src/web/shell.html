<!doctype html>
<html lang="en-us">

<head>
    <link rel="icon" type="image/svg+xml" href="/assets/logo.svg">
    <meta charset="utf-8" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no" />
    <title>tablemd</title>
    <style>
        body {
            margin: 0;
            background-color: black;
        }

        .game {
            position: absolute;
            top: 0px;
            left: 0px;
            margin: 0px;
            border: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: block;
            image-rendering: optimizeSpeed;
            image-rendering: -moz-crisp-edges;
            image-rendering: -o-crisp-edges;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: optimize-contrast;
            image-rendering: crisp-edges;
            image-rendering: pixelated;
            -ms-interpolation-mode: nearest-neighbor;
        }

        table,
        th,
        td {
            border: 1px solid white;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 5px;
        }

        .side-panel {
            position: fixed;
            top: 15px;
            right: 15px;
            width: 400px;
            height: calc(100vh - 30px);
            background-color: rgba(40, 40, 40, 0.9);
            border: rgba(120, 120, 120, 0.9) solid 1px;
            border-radius: 18px;
            backdrop-filter: blur(10px);
            z-index: 1000;
            padding: 10px;
            box-sizing: border-box;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: transform 0.3s ease-in-out;
        }

        .side-panel.collapsed {
            transform: translateX(100%);
        }

        .toggle-button {
            position: absolute;
            top: 20px;
            left: -40px;
            width: 40px;
            height: 40px;
            background-color: rgba(40, 40, 40, 0.9);
            border: rgba(120, 120, 120, 0.9) solid 1px;
            border-radius: 12px 0 0 12px;
            backdrop-filter: blur(10px);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            transition: background-color 0.2s;
        }

        .toggle-button:hover {
            background-color: rgba(60, 60, 60, 0.9);
        }

        .toggle-button svg {
            transition: transform 0.3s ease-in-out;
        }

        .side-panel.collapsed .toggle-button svg {
            transform: rotate(180deg);
        }

        .code-section {
            flex: 1;
            background-color: rgba(60, 60, 60, 0.8);
            border-radius: 8px;
            position: relative;
        }

        .overflow-container {
            overflow: auto;
            width: 100%;
            height: 100%;
        }

        #markdown-source {
            padding: 12px 10px;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 12px;
            line-height: 1.4;
            white-space: pre;
        }

        .copy-button {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background-color: rgba(80, 80, 80, 0.9);
            border: 1px solid rgba(120, 120, 120, 0.7);
            border-radius: 4px;
            color: white;
            padding: 6px 8px;
            cursor: pointer;
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: background-color 0.2s;
        }

        .copy-button:hover {
            background-color: rgba(100, 100, 100, 0.9);
        }

        .copy-button:active {
            background-color: rgba(60, 60, 60, 0.9);
        }

        #html-render {
            flex: 1;
            background-color: rgba(60, 60, 60, 0.8);
            border-radius: 8px;
            padding: 10px;
            overflow: auto;
        }
    </style>
</head>

<body>
    <canvas class="game" id="canvas" oncontextmenu="event.preventDefault()"></canvas>
    <div class="side-panel" id="side-panel">
        <button class="toggle-button" onclick="toggleSidePanel()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                <path d="M8.59 16.59L10 18l6-6-6-6-1.41 1.41L13.17 12z" />
            </svg>
        </button>
        <div class="code-section">
            <div class="overflow-container">
                <div id="markdown-source">
                </div>
            </div>
            <button class="copy-button" onclick="copyCodeSection()">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
                    <path
                        d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z" />
                </svg>
                Copy
            </button>
        </div>
        <div id="html-render">
        </div>
    </div>
    <script type="text/javascript">
        var Module = {
            preRun: [],
            print: (function () {
                return function (text) {
                    text = Array.prototype.slice.call(arguments).join(" ");
                    console.log(text);
                };
            })(),
            printErr: function (text) {
                text = Array.prototype.slice.call(arguments).join(" ");
                console.error(text);
            },
            onRuntimeInitialized: function () {
                console.log("Initialized");
            }
        };
        window.onerror = function () {
            console.log("onerror: " + event.message);
        };

        function copyCodeSection() {
            const codeSection = document.getElementById('markdown-source');
            const text = codeSection.innerText;
            navigator.clipboard.writeText(text).then(function () {
                // Provide visual feedback
                const button = document.querySelector('.copy-button');
                if (!button) {
                    return;
                }
                const originalText = button.innerHTML;
                button.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/></svg>Copied!';
                setTimeout(() => {
                    button.innerHTML = originalText;
                }, 2000);
            }).catch(function (err) {
                console.error('Failed to copy text: ', err);
            });
        }

        function toggleSidePanel() {
            const sidePanel = document.getElementById('side-panel');
            sidePanel.classList.toggle('collapsed');
        }

        function handleWebPaste(text) {
            if (Module._handle_paste_from_web) {
                const textPtr = Module._malloc(text.length + 1);
                Module.stringToUTF8(text, textPtr, text.length + 1);
                Module._handle_paste_from_web(textPtr);
                Module._free(textPtr);
            }
        }

        // Add keyboard event listener for paste
        document.addEventListener('keydown', function (event) {
            if ((event.ctrlKey || event.metaKey) && event.key === 'v') {
                event.preventDefault();
                navigator.clipboard.readText().then(function (text) {
                    handleWebPaste(text);
                }).catch(function (err) {
                    console.error('Failed to read clipboard: ', err);
                });
            }
        });
    </script>
    {{{ SCRIPT }}}
</body>

</html>
